# Web estàtica: tots els fitxers a l'arrel del repositori
[build]
  publish = "."
  # No cal compilar. Una ordre que no fa res evita que Netlify executi un build autodetectat.
  command = "echo 'Web estatica: sense build'"

# No servir el backend ni la documentació
[[redirects]]
  from = "/Code.gs"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"

[[headers]]
  for = "/plantilla.pdf"
  [headers.values]
    Cache-Control = "public, max-age=3600"
