<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Fichaje</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>
      </span>
      <span id="empresa">Fichaje</span>
    </div>
    <nav class="tabs" role="tablist">
      <button data-tab="fichar" class="active" role="tab">Fichar</button>
      <button data-tab="admin" role="tab">Administración</button>
    </nav>
  </header>

  <div id="demo-banner" class="banner" hidden>
    Modo demo: los datos se guardan solo en este navegador. Empleados: <b>E001 / 1234</b>, <b>E002 / 5678</b> · Admin: <b>admin</b>
  </div>

  <main>
    <!-- ===================== FICHAR ===================== -->
    <section id="tab-fichar" class="tab active">
      <div class="clock">
        <div id="hora" class="hora">--:--:--</div>
        <div id="fecha" class="fecha">&nbsp;</div>
      </div>

      <div class="card" id="card-login">
        <h2>Identifícate</h2>
        <form id="form-login" autocomplete="on">
          <label>Código de empleado
            <input id="codigo" name="username" autocomplete="username" autocapitalize="characters" spellcheck="false" required placeholder="E001">
          </label>
          <label>PIN
            <input id="pin" name="password" type="password" inputmode="numeric" autocomplete="current-password" required placeholder="••••">
          </label>
          <label class="check"><input type="checkbox" id="recordar"> Recordar mi código en este dispositivo</label>
          <button class="btn primary block" type="submit">Continuar</button>
        </form>
      </div>

      <div class="card" id="card-fichar" hidden>
        <div class="who">
          <div>
            <div class="muted small">Hola,</div>
            <div id="emp-nombre" class="nombre"></div>
          </div>
          <button id="btn-salir" class="btn ghost small" type="button">Cambiar usuario</button>
        </div>

        <div id="estado" class="estado"></div>

        <button id="btn-fichar" class="btn-fichar entrada" type="button">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path id="ico-path" d="M10 17l5-5-5-5M15 12H3M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></svg>
          <span id="btn-fichar-txt">Fichar entrada</span>
        </button>

        <label class="check center"><input type="checkbox" id="geo"> Adjuntar mi ubicación al fichaje</label>

        <h3>Fichajes de hoy</h3>
        <ul id="lista-hoy" class="timeline"></ul>
        <p class="muted small center" id="auto-logout"></p>
      </div>
    </section>

    <!-- ===================== ADMIN ===================== -->
    <section id="tab-admin" class="tab">
      <div class="card narrow" id="card-admin-login">
        <h2>Acceso administración</h2>
        <form id="form-admin">
          <label>Contraseña
            <input id="admin-pass" type="password" required autocomplete="current-password">
          </label>
          <button class="btn primary block" type="submit">Entrar</button>
        </form>
      </div>

      <div id="admin-panel" hidden>
        <div class="card">
          <div class="card-head">
            <h2>Informe de fichajes</h2>
            <button id="btn-admin-salir" class="btn ghost small" type="button">Salir</button>
          </div>
          <div class="grid">
            <label>Empleado
              <select id="f-emp"><option value="*">Todos los empleados</option></select>
            </label>
            <label>Desde <input type="date" id="f-desde"></label>
            <label>Hasta <input type="date" id="f-hasta"></label>
          </div>
          <div class="chips">
            <button type="button" data-rango="hoy">Hoy</button>
            <button type="button" data-rango="semana">Esta semana</button>
            <button type="button" data-rango="mes">Este mes</button>
            <button type="button" data-rango="mesant">Mes anterior</button>
            <button type="button" data-rango="todo">Todo</button>
          </div>
          <div class="actions">
            <button id="btn-ver" class="btn primary" type="button">Ver informe</button>
            <button id="btn-drive" class="btn" type="button">Generar documento en Drive</button>
          </div>
          <div id="doc-links" class="links" hidden></div>
        </div>

        <div id="resultado" hidden>
          <div class="stats" id="stats"></div>

          <div class="card">
            <div class="card-head">
              <h2>Totales por empleado</h2>
              <div class="mini-actions">
                <button id="btn-print" class="btn small" type="button">Imprimir / PDF</button>
                <button data-csv="totales" class="btn small" type="button">CSV</button>
              </div>
            </div>
            <div class="table-wrap"><table id="t-totales"></table></div>
          </div>

          <div class="card">
            <div class="card-head">
              <h2>Detalle diario</h2>
              <button data-csv="diario" class="btn small" type="button">CSV</button>
            </div>
            <div class="table-wrap"><table id="t-diario"></table></div>
          </div>

          <div class="card">
            <div class="card-head">
              <h2>Todos los fichajes</h2>
              <button data-csv="fichajes" class="btn small" type="button">CSV</button>
            </div>
            <div class="table-wrap"><table id="t-fichajes"></table></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
